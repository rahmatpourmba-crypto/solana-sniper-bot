name: Solana Sniper & Simulator Runner

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration to run the bot (in minutes)'
        required: true
        default: '30'

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Solana Sniper Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTTP_PROXY: ""
        run: |
          set -o pipefail
          timeout ${{ github.event.inputs.duration_minutes || 30 }}m python bot.py 2>&1 | tee bot_run.log || true

      - name: Upload Run Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-run-log
          path: bot_run.log
          retention-days: 14
