name: Solana Sniper & Simulator Runner

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duration to run the bot (in minutes)'
        required: true
        default: '30'
  schedule:
    # Run periodically every 6 hours automatically
    - cron: '0 */6 * * *'

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Solana Sniper Bot
        run: |
          # Run bot with timeout
          timeout ${{ github.event.inputs.duration_minutes || 30 }}m python bot.py || true
